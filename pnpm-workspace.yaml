packages:
  - "apps/*"
  - "packages/*"

# Native/build-time deps we explicitly allow to run install scripts.
allowBuilds:
  esbuild: true
  "@node-rs/argon2": true
  # Testcontainers transitive deps. We reach Docker via the local socket, not
  # SSH, so these native builds are not needed (pure-JS fallbacks are used).
  cpu-features: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@radix-ui/primitive@1.1.7'
  - '@radix-ui/react-compose-refs@1.1.4'
  - '@radix-ui/react-slot@1.3.1'
  - '@turbo/darwin-64@2.10.6'
  - '@turbo/darwin-arm64@2.10.6'
  - '@turbo/linux-64@2.10.6'
  - '@turbo/linux-arm64@2.10.6'
  - '@turbo/windows-64@2.10.6'
  - '@turbo/windows-arm64@2.10.6'
  - lucide-react@1.26.0
  - react-router@8.3.0
  - turbo@2.10.6
  - esbuild@0.24.3 || 0.28.1
  - brace-expansion@5.0.8

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  # esbuild advisories in dev-only tools (GHSA-67mh-4wv8-2f99 via
  # drizzle-kit > @esbuild-kit, GHSA-g7r4-m6w7-qqqr via tsup). Both go past
  # the declared ranges (~0.18.20, ^0.27.0); db:generate and the tsup build
  # were checked with them. The first is scoped to its one parent, so it does
  # not also rewrite other packages' esbuild peer ranges.
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  esbuild@>=0.27.3 <0.28.1: ^0.28.1